<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student: Online Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .question-card { display: none; } /* Hide all questions by default */
        .question-card.active { display: block; } /* Show only the active one */
        #timer-sticky {
            position: sticky;
            top: 10px;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-9">
                
                <div id="timer-sticky" class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 shadow-sm rounded">
                    <h2 class="h4 mb-0">Online Examination</h2>
                    <div class="text-danger fw-bold fs-5">
                        Time Left: <span id="time-display">10:00</span>
                    </div>
                </div>

                <div class="text-end mb-3">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                </div>

                <form th:action="@{/student/submit}" method="post" id="examForm">
                    
                    <div th:each="q, iterStat : ${questions}" 
                         th:class="${iterStat.first} ? 'question-card active card shadow-sm mb-4' : 'question-card card shadow-sm mb-4'"
                         th:id="'qcard-' + ${iterStat.index}">
                        
                        <div class="card-header bg-white fw-bold d-flex justify-content-between">
                            <span>Question <span th:text="${iterStat.count}">1</span> of <span th:text="${questions.size()}">5</span></span>
                            <span class="badge bg-primary">Select one</span>
                        </div>
                        
                        <div class="card-body">
                            <p class="card-text fs-5" th:text="${q.question}">Question text?</p>
                            
                            <div class="mt-3">
                                <div class="form-check mb-3 p-3 border rounded">
                                    <input class="form-check-input ms-0 me-2" type="radio" 
                                           th:name="'q_' + ${q.id}" th:id="'q' + ${q.id} + 'a'" th:value="${q.optionA}" required>
                                    <label class="form-check-label w-100" th:for="'q' + ${q.id} + 'a'" th:text="${q.optionA}"></label>
                                </div>
                                
                                <div class="form-check mb-3 p-3 border rounded">
                                    <input class="form-check-input ms-0 me-2" type="radio" 
                                           th:name="'q_' + ${q.id}" th:id="'q' + ${q.id} + 'b'" th:value="${q.optionB}">
                                    <label class="form-check-label w-100" th:for="'q' + ${q.id} + 'b'" th:text="${q.optionB}"></label>
                                </div>
                                
                                <div class="form-check mb-3 p-3 border rounded">
                                    <input class="form-check-input ms-0 me-2" type="radio" 
                                           th:name="'q_' + ${q.id}" th:id="'q' + ${q.id} + 'c'" th:value="${q.optionC}">
                                    <label class="form-check-label w-100" th:for="'q' + ${q.id} + 'c'" th:text="${q.optionC}"></label>
                                </div>
                                
                                <div class="form-check mb-3 p-3 border rounded">
                                    <input class="form-check-input ms-0 me-2" type="radio" 
                                           th:name="'q_' + ${q.id}" th:id="'q' + ${q.id} + 'd'" th:value="${q.optionD}">
                                    <label class="form-check-label w-100" th:for="'q' + ${q.id} + 'd'" th:text="${q.optionD}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white d-flex justify-content-between">
                            <button type="button" class="btn btn-secondary" 
                                    th:if="${!iterStat.first}" th:onclick="'showPrev(' + ${iterStat.index} + ')'">Previous</button>
                            <span th:if="${iterStat.first}"></span> <button type="button" class="btn btn-primary" 
                                    th:if="${!iterStat.last}" th:onclick="'showNext(' + ${iterStat.index} + ')'">Next Question</button>
                            
                            <button type="submit" class="btn btn-success" 
                                    th:if="${iterStat.last}" onclick="return confirm('Submit your exam?')">Submit Final Exam</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- TIMER LOGIC ---
        let totalTime = 600; // 10 minutes in seconds
        const display = document.querySelector('#time-display');
        
        const timer = setInterval(function () {
            let minutes = Math.floor(totalTime / 60);
            let seconds = totalTime % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            display.textContent = minutes + ":" + seconds;

            if (--totalTime < 0) {
                clearInterval(timer);
                alert("Time is up! Submitting your exam automatically.");
                document.getElementById('examForm').submit();
            }
        }, 1000);

        // --- PAGINATION LOGIC ---
        function showNext(currentIndex) {
            document.getElementById('qcard-' + currentIndex).classList.remove('active');
            document.getElementById('qcard-' + (currentIndex + 1)).classList.add('active');
            window.scrollTo(0, 0);
        }

        function showPrev(currentIndex) {
            document.getElementById('qcard-' + currentIndex).classList.remove('active');
            document.getElementById('qcard-' + (currentIndex - 1)).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
