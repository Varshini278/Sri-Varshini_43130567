<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">Admin Dashboard</h2>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger shadow-sm">Logout</button>
            </form>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">
                Add New Student
            </div>
            <div class="card-body">
                <form th:action="@{/admin/addStudent}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <input name="name" placeholder="Student Name" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <input name="email" placeholder="Email" class="form-control" type="email" required>
                    </div>
                    <div class="col-md-4">
                        <input name="password" placeholder="Password" class="form-control" type="password" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Add Student</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-info text-white">
                Add New Teacher
            </div>
            <div class="card-body">
                <form th:action="@{/admin/addTeacher}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <input name="name" placeholder="Teacher Name" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <input name="email" placeholder="Email" class="form-control" type="email" required>
                    </div>
                    <div class="col-md-4">
                        <input name="password" placeholder="Password" class="form-control" type="password" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-warning text-white">Add Teacher</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Students</div>
                    <div class="card-body">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${students}">
                                    <td th:text="${s.name}"></td>
                                    <td>
                                        <a th:href="@{/admin/deleteStudent/{id}(id=${s.id})}" 
                                           class="btn btn-sm btn-outline-danger" 
                                           onclick="return confirm('Delete this student?')">Delete</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(students)}">
                                    <td colspan="2" class="text-center text-muted">No students added yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Teachers</div>
                    <div class="card-body">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${teachers}">
                                    <td th:text="${t.name}"></td>
                                    <td>
                                        <a th:href="@{/admin/deleteTeacher/{id}(id=${t.id})}" 
                                           class="btn btn-sm btn-outline-danger" 
                                           onclick="return confirm('Delete this teacher?')">Delete</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(teachers)}">
                                    <td colspan="2" class="text-center text-muted">No teachers added yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
