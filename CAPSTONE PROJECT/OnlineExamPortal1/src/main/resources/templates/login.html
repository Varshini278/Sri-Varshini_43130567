<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">User Login</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/login}" method="post">
                            
                            <p class="text-danger text-center" th:if="${param.error}">Invalid Email or Password</p>
                            <p class="text-success text-center" th:if="${param.logout}">You have been logged out</p>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" name="username" id="email" class="form-control"
                                       placeholder="Enter Email" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control"
                                       placeholder="Enter Password" required>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">Select Role</label>
                                <select name="role" id="role" class="form-select" required>
                                    <option value="ROLE_ADMIN">Admin</option>
                                    <option value="ROLE_TEACHER">Teacher</option>
                                    <option value="ROLE_STUDENT" selected>Student</option>
                                </select>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
