<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exam Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .result-card { border-radius: 15px; border: none; }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
            border: 5px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow result-card">
                    <div class="card-body p-5">
                        <h1 class="text-success mb-3">Exam Completed!</h1>
                        <p class="text-muted mb-4">You have successfully submitted your answers.</p>
                        
                        <div class="score-circle mb-4">
                            <span th:text="${score}">0</span> / <span th:text="${total}">0</span>
                        </div>

                        <div class="alert alert-secondary mt-3">
                            Correct Answers: <strong th:text="${score}">0</strong> out of 
                            <strong th:text="${total}">0</strong> questions.
                        </div>

                        <div class="mt-4 d-grid gap-2">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-primary btn-lg w-100">Finish and Logout</button>
                            </form>
                        </div>
                    </div>
                </div>
                <p class="mt-4 text-muted small">Online Exam Portal &copy; 2025</p>
            </div>
        </div>
    </div>
</body>
</html>
