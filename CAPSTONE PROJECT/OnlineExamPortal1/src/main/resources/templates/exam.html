<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Examination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-5 text-center">Online Examination</h2>
        
        <form action="/submit" method="post"> 
            
            <div th:each="q, i : ${questions}" class="card shadow-sm mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0" th:text="${'Question ' + (i.index + 1) + ' of ' + questions.size()}"></h5>
                </div>
                <div class="card-body">
                    <p class="card-text fw-bold" th:text="${q.question}"></p>
                    
                    <div class="mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="${q.id}" th:id="${q.id + 'A'}" th:value="${q.optionA}" required>
                            <label class="form-check-label" th:for="${q.id + 'A'}" th:text="${q.optionA}"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="${q.id}" th:id="${q.id + 'B'}" th:value="${q.optionB}">
                            <label class="form-check-label" th:for="${q.id + 'B'}" th:text="${q.optionB}"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="${q.id}" th:id="${q.id + 'C'}" th:value="${q.optionC}">
                            <label class="form-check-label" th:for="${q.id + 'C'}" th:text="${q.optionC}"></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:name="${q.id}" th:id="${q.id + 'D'}" th:value="${q.optionD}">
                            <label class="form-check-label" th:for="${q.id + 'D'}" th:text="${q.optionD}"></label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid mt-5 mb-5">
                <button type="submit" class="btn btn-success btn-lg">Submit Exam</button>
            </div>
        </form>
    </div>
</body>
</html>
